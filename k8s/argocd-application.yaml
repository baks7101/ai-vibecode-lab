# ArgoCD Application: tells ArgoCD to watch the k8s/ folder of this repo
# and keep the cluster in sync with it. This is the GitOps handoff:
# you change manifests in git, ArgoCD reconciles the cluster to match.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meditriage
  namespace: argocd
spec:
  # The fence: see argocd-project.yaml. Was "default", which allows any
  # repo, any namespace and any resource type.
  project: meditriage
  source:
    repoURL: https://github.com/baks7101/ai-vibecode-lab.git
    targetRevision: main
    path: k8s
    directory:
      # Not applied by ArgoCD:
      # - argocd-application.yaml: the Application manifest itself.
      # - argocd-project.yaml: the AppProject (must exist before any sync).
      # - 40-external-secret.yaml: applied by hand for now. The reason for
      #   this exclusion is unconfirmed (likely ESO's CRDs not existing yet
      #   on first sync); bring it under GitOps once checked on a live cluster.
      exclude: "{argocd-application.yaml,argocd-project.yaml,40-external-secret.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: meditriage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
