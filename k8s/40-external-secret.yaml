# Tells ESO: read from AWS Secrets Manager, create the k8s secret the app uses.
# This replaces the manual `kubectl create secret` step.
#
# Scoped to ONE namespace. A namespaced SecretStore can only be used by
# ExternalSecrets in its own namespace, and can only log in as a service
# account in its own namespace. Previously a ClusterSecretStore let ANY
# namespace have ESO fetch this app's secrets (and the OpenSearch master
# password) on its behalf. Other apps get their own store, account and role.

# ---------------------------------------------------------------------
# The identity ESO logs in as for this namespace. The annotation names
# the IAM role (terraform/modules/security/eso-irsa.tf), whose trust
# policy accepts ONLY this account. No pod runs as this account, so no
# token is mounted; ESO requests short-lived tokens for it instead.
# ---------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meditriage-secrets-reader
  namespace: meditriage
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::761584754677:role/securestack-meditriage-secrets-reader
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: meditriage
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
      auth:
        jwt:
          serviceAccountRef:
            # Namespaced store: this can only name an account in meditriage.
            name: meditriage-secrets-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meditriage-secrets
  namespace: meditriage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: meditriage-secrets
    creationPolicy: Owner
  data:
    - secretKey: openai-api-key
      remoteRef:
        key: securestack/app/secrets
        property: openai-api-key
    - secretKey: llm-guard-token
      remoteRef:
        key: securestack/app/secrets
        property: llm-guard-token
    - secretKey: jwt-secret
      remoteRef:
        key: securestack/app/secrets
        property: jwt-secret
