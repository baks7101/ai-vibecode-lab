# Tells ESO: read from AWS Secrets Manager, create the k8s secret the app uses.
# This REPLACES the manual `kubectl create secret` step.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: meditriage
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
# The service account in the meditriage namespace that ESO uses here.
# (Annotated with the ESO IRSA role so it can read from Secrets Manager.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: meditriage
  annotations:
    eks.amazonaws.com/role-arn: ESO_ROLE_ARN_PLACEHOLDER
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: meditriage-secrets
  namespace: meditriage
spec:
  refreshInterval: 1h            # re-sync from Secrets Manager every hour
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: meditriage-secrets     # the k8s secret name the app already expects
    creationPolicy: Owner
  data:
    - secretKey: openai-api-key
      remoteRef:
        key: securestack/app/secrets
        property: openai-api-key
    - secretKey: llm-guard-token
      remoteRef:
        key: securestack/app/secrets
        property: llm-guard-token
    - secretKey: jwt-secret
      remoteRef:
        key: securestack/app/secrets
        property: jwt-secret
