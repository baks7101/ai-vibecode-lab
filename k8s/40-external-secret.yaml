# Tells ESO: read from AWS Secrets Manager, create the k8s secret the app uses.
# This REPLACES the manual `kubectl create secret` step.
#
# Uses a ClusterSecretStore backed by ESO's own controller service account
# (external-secrets/external-secrets), which is annotated with the IRSA role.
# That SA is exactly what the IRSA trust policy allows, so no extra SA needed.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meditriage-secrets
  namespace: meditriage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: meditriage-secrets
    creationPolicy: Owner
  data:
    - secretKey: openai-api-key
      remoteRef:
        key: securestack/app/secrets
        property: openai-api-key
    - secretKey: llm-guard-token
      remoteRef:
        key: securestack/app/secrets
        property: llm-guard-token
    - secretKey: jwt-secret
      remoteRef:
        key: securestack/app/secrets
        property: jwt-secret
