apiVersion: apps/v1
kind: Deployment
metadata:
  name: meditriage-api
  namespace: meditriage
  labels:
    app: meditriage-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meditriage-api
  template:
    metadata:
      labels:
        app: meditriage-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      # The app never calls the Kubernetes API, so it gets no credential
      # for it. By default every pod gets a service account token mounted,
      # which would be a free cluster credential for an attacker.
      automountServiceAccountToken: false
      # Total time allowed for shutdown before SIGKILL. The preStop pauses
      # below and the app's SHUTDOWN_TIMEOUT_MS (10s) must fit inside it.
      terminationGracePeriodSeconds: 30
      # Pod-level security (applies to both containers): run as non-root
      # user 1000 with the runtime's default seccomp profile. Privilege
      # escalation is blocked per container, further down.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        # ---- Container 1: the application ----
        - name: api
          image: 761584754677.dkr.ecr.eu-west-2.amazonaws.com/securestack-api:v2
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: LLM_GUARD_URL
              value: "http://localhost:8000"
            - name: LLM_GUARD_FAIL_OPEN
              value: "false"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: meditriage-secrets
                  key: openai-api-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: meditriage-secrets
                  key: jwt-secret
            - name: LLM_GUARD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: meditriage-secrets
                  key: llm-guard-token
          # On shutdown, Kubernetes removes the pod from Service endpoints
          # and sends SIGTERM at the same time, so a few requests can still
          # arrive after SIGTERM. Pausing 5s first lets endpoint removal
          # finish; then SIGTERM triggers the graceful shutdown in app.js.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /metrics
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /metrics
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        # ---- Container 2: the LLM-Guard sidecar ----
        - name: llm-guard
          # Pinned by digest (multi-arch index: amd64 + arm64), taken from
          # :latest on 10 Nov 2026. Cannot change without a PR. Must match
          # ai-bom.json and .github/workflows/pr-check.yml.
          image: laiyer/llm-guard-api@sha256:bea3efb1220ad18149b73de625c55e6d835bf8b45023a089a3762012a86550ba
          ports:
            - containerPort: 8000
              name: guard
          env:
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: meditriage-secrets
                  key: llm-guard-token
          # The guard must outlive the API: the API is fail-closed, so if
          # the guard stopped first, the API's last in-flight requests
          # would fail. 15s covers the API's 5s pause plus its 10s shutdown
          # timeout, and still fits inside the 30s grace period.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
          volumeMounts:
            - name: guard-config
              mountPath: /home/user/app/config/scanners.yml
              subPath: scanners.yml
          resources:
            requests:
              cpu: "250m"
              memory: "2Gi"
            limits:
              cpu: "1000m"
              memory: "4Gi"
          # Readiness gated on a REAL scan, not /healthz. /healthz returns
          # 200 before the ML models load, so probing it marks the pod
          # ready before it can actually scan (the cold-start 500 we hit
          # live). This exec probe only succeeds once a real prompt scan
          # returns, so k8s won't route traffic until the guard truly works.
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - >-
                  import os,urllib.request,json;
                  req=urllib.request.Request("http://localhost:8000/analyze/prompt",
                  data=json.dumps({"prompt":"readiness probe"}).encode(),
                  headers={"Authorization":"Bearer "+os.environ["AUTH_TOKEN"],"Content-Type":"application/json"});
                  urllib.request.urlopen(req,timeout=8)
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 20
            timeoutSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: guard-config
          configMap:
            name: llm-guard-config
