# EXAMPLE ONLY - committed to git as documentation.
# The real secret is created at deploy time from actual values and is
# NEVER committed. See the deploy notes below.
#
# Create the real secret with:
#   kubectl create secret generic meditriage-secrets \
#     --namespace meditriage \
#     --from-literal=openai-api-key='sk-...' \
#     --from-literal=llm-guard-token='<a-random-token>'
#
apiVersion: v1
kind: Secret
metadata:
  name: meditriage-secrets
  namespace: meditriage
type: Opaque
stringData:
  openai-api-key: "REPLACE_ME_NOT_A_REAL_KEY"
  llm-guard-token: "REPLACE_ME_NOT_A_REAL_TOKEN"
