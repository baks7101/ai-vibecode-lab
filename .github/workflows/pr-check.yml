name: PR Security Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'demo/**'

jobs:
  full-security:
    name: Full Security Gate
    uses: baks7101/SecureStack-platform/.github/workflows/full-security-scan.yml@main
    with:
      scan-path: "."
      has-docker: true
      has-terraform: false
      has-kubernetes: true
      run-dast: false
    secrets: inherit
