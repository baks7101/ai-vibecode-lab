name: PR Security Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write
  id-token: write # allow the reusable workflow to mint an OIDC token for AWS

jobs:
  full-security:
    name: Full Security Gate
    uses: baks7101/SecureStack-platform/.github/workflows/full-security-scan.yml@main
    with:
      scan-path: "."
      has-docker: true
      has-terraform: true
      has-kubernetes: true
      run-dast: true
      # Same digest as k8s/10-deployment.yaml and ai-bom.json, so CI's DAST
      # stage tests exactly the guard we deploy. Bump all three together.
      llm-guard-image: laiyer/llm-guard-api@sha256:bea3efb1220ad18149b73de625c55e6d835bf8b45023a089a3762012a86550ba
      has-ai: true
      aws-role-arn: arn:aws:iam::761584754677:role/github-actions-ai-vibecode-lab
    secrets: inherit